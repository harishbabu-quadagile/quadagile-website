name: QuadAgile Frontend Auto-Deploy

# Trigger on pushes to main branch
on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Upload frontend to Hostinger via FTP
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.quadagile.in
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: app/dist       # Folder to deploy
          server-dir: public_html   # Destination folder on Hostinger
          git-ftp-args: --insecure  # optional, bypass some SSL issues

